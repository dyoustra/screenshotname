[project]
name = "shotname"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "anyascii",
    "httpx",
    "ocrmac",
    "pillow",
    "pydantic",
    "typer",
]

[project.scripts]
shotname = "shotname.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotname"]

[tool.ruff.format]
# The test tree is hash-locked; reformatting it fails the gate no matter what
# the suite does. Excluding it here means `ruff format .` stays safe to run.
exclude = ["tests/**"]

[tool.mypy]
exclude = ['^\.venv/', '^build/', '^dist/']

# `typer.testing` re-exports click's `Result` without an explicit alias, which
# --strict rejects under --no-implicit-reexport. The import lives in the locked
# test tree, so the exemption has to live here.
[[tool.mypy.overrides]]
module = ["typer.testing"]
implicit_reexport = true

# `ocrmac` ships no type information, and it is the one library the stack table
# names that does not. The import sits behind `VisionOcr.recognize` alone.
[[tool.mypy.overrides]]
module = ["ocrmac.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
